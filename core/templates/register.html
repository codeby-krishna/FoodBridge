<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | FoodBridge</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5faf5;
            color: #263238;
            min-height: 100vh;
        }

        .navbar {
            background: #2e7d32;
            color: white;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .nav-link {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        .register-container {
            min-height: calc(100vh - 70px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .register-card {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
        }

        .register-card h1 {
            text-align: center;
            color: #1b5e20;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #78909c;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #37474f;
        }

        input,
        select {
            width: 100%;
            padding: 14px;
            border: 1px solid #d7e5d8;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            background: white;
        }

        input:focus,
        select:focus {
            border-color: #43a047;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 12px;
            border-radius: 9px;
            margin-bottom: 18px;
            text-align: center;
        }

        .register-btn {
            width: 100%;
            border: none;
            background: #2e7d32;
            color: white;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .register-btn:hover {
            background: #1b5e20;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #78909c;
            font-size: 14px;
        }

        .login-link a {
            color: #2e7d32;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .navbar {
                padding: 18px 5%;
            }

            .nav-link {
                display: none;
            }

            .register-card {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="logo">🍲 FoodBridge</div>

        <div>
            <a href="{% url 'home' %}" class="nav-link">Home</a>
            <a href="{% url 'find_food' %}" class="nav-link">Find Food</a>
        </div>
    </nav>

    <main class="register-container">

        <div class="register-card">

            <h1>Create Account</h1>

            <p class="subtitle">
                Join FoodBridge and help share food.
            </p>

            {% if error %}
            <div class="error">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <div class="form-group">
                    <label for="username">Username</label>

                    <input type="text" id="username" name="username" placeholder="Enter your username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input type="password" id="password" name="password" placeholder="Create a password" required>
                </div>

                <div class="form-group">
                    <label for="role">Choose Your Role</label>

                    <select id="role" name="role" required>
                        <option value="">-- Select your role --</option>
                        <option value="Donor">🥘 Donor</option>
                        <option value="NGO">🏢 NGO</option>
                        <option value="Volunteer">🚚 Volunteer</option>
                    </select>
                </div>

                <button type="submit" class="register-btn">
                    Create Account
                </button>

            </form>

            <p class="login-link">
                Already have an account?
                <a href="{% url 'login' %}">Login</a>
            </p>

        </div>

    </main>

</body>

</html>
