<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NGO Profile | FoodBridge</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5faf5;
            color: #263238;
        }

        .navbar {
            background: #2e7d32;
            color: white;
            padding: 18px 8%;
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            max-width: 550px;
            margin: 55px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #1b5e20;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #78909c;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #37474f;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d7e5d8;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #43a047;
            box-shadow: 0 0 0 3px rgba(67, 160, 71, 0.10);
        }

        button {
            width: 100%;
            padding: 14px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1b5e20;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2e7d32;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .container {
                margin: 30px auto;
            }

            .card {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="navbar">
        🍲 FoodBridge
    </div>

    <div class="container">

        <div class="card">

            <h1>🏢 NGO Profile</h1>

            <p class="subtitle">
                Enter your NGO details to claim food.
            </p>

            <form method="POST">

                {% csrf_token %}

                {% for field in form %}

                <div class="form-group">

                    <label for="{{ field.id_for_label }}">
                        {{ field.label }}
                    </label>

                    {{ field }}

                    {% if field.errors %}
                    <div style="color:#c62828; font-size:13px; margin-top:5px;">
                        {{ field.errors }}
                    </div>
                    {% endif %}

                </div>

                {% endfor %}

                <button type="submit">
                    Save NGO Profile
                </button>

            </form>

            <a href="{% url 'home' %}" class="back">
                ← Back to Home
            </a>

        </div>

    </div>

</body>

</html>
