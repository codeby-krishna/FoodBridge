<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | FoodBridge</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5faf5;
            color: #263238;
            min-height: 100vh;
        }

        .navbar {
            background: #2e7d32;
            color: white;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .nav-link {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        .login-container {
            min-height: calc(100vh - 70px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
        }

        .login-card h1 {
            text-align: center;
            color: #1b5e20;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #78909c;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #37474f;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d7e5d8;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #43a047;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 12px;
            border-radius: 9px;
            margin-bottom: 18px;
            text-align: center;
        }

        .login-btn {
            width: 100%;
            border: none;
            background: #2e7d32;
            color: white;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #1b5e20;
        }

        .register-text {
            text-align: center;
            margin-top: 22px;
            color: #78909c;
        }

        .register-text a {
            color: #2e7d32;
            font-weight: bold;
            text-decoration: none;
        }

        @media (max-width: 600px) {

            .navbar {
                padding: 18px 5%;
            }

            .nav-link {
                display: none;
            }

            .login-card {
                padding: 28px 22px;
            }

        }

    </style>
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            🍲 FoodBridge
        </div>

        <div>
            <a href="{% url 'home' %}" class="nav-link">Home</a>
            <a href="{% url 'find_food' %}" class="nav-link">Find Food</a>
        </div>

    </nav>


    <main class="login-container">

        <div class="login-card">

            <h1>Welcome Back</h1>

            <p class="subtitle">
                Login to continue using FoodBridge.
            </p>


            {% if error %}
                <div class="error">
                    {{ error }}
                </div>
            {% endif %}


            <form method="POST">

                {% csrf_token %}

                <div class="form-group">

                    <label>Username</label>

                    <input
                        type="text"
                        name="username"
                        placeholder="Enter your username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Password</label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button type="submit" class="login-btn">
                    Login
                </button>

            </form>


            <p class="register-text">

                Don't have an account?

                <a href="{% url 'register' %}">
                    Create Account
                </a>

            </p>

        </div>

    </main>

</body>

</html>
